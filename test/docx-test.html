<!doctype html><html><head><meta charset="utf-8"></head><body><script type="module">
import { exportDocx } from '/src/export.ts';
const segs = []; const fn = {};
const lorem = 'Ebu Hurejre, radijallahu anhu, prenosi da je Allahov Poslanik ﷺ rekao: „Allah ne prima namaz nikome od vas kad izgubi abdest, dok ne uzme abdest.“ Ovaj hadis bilježe Buharija i Muslim.';
let k = 0;
for (let c = 1; c <= 3; c++) {
  segs.push({ id: 'h' + c, ar: '', bs: 'Poglavlje o čistoći ' + c, page: c, paraStart: true, heading: true });
  for (let i = 0; i < 6; i++) {
    const id = 'f' + k++;
    fn[id] = { id, text: 'Bilježi Muslim, br. ' + (200 + k) + '.' };
    segs.push({ id: 's' + c + '_' + i, ar: '', bs: lorem + (i % 3 == 0 ? `[^${id}]` : ''), page: c, paraStart: i % 2 == 0, heading: false });
  }
}
const p = { title: 'Umdetul-ahkam', segments: segs, footnotes: fn, book: { size: 'A5', fontSize: 11, author: 'Abdulgani el-Makdisi', translator: 'Probni prevodilac' } };
const blob = await exportDocx(p, false);
const buf = new Uint8Array(await blob.arrayBuffer());
let s = ''; for (const b of buf) s += String.fromCharCode(b);
window.__docx = btoa(s);
</script></body></html>
